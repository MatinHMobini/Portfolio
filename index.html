    <script>
      // Runs before first paint: mark JS as available and decide whether the intro will play,
      // so the content does not flash before the intro covers it.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          if (localStorage.getItem('pq.crt') === 'off') d.classList.add('no-crt');
        } catch (e) {}
        var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) d.classList.add('reduced');
        else if (!/[?&]nointro/.test(location.search)) d.classList.add('intro-pending');
      })();
    </script>
  </head>
  <body>
    <div class="boot-cover" aria-hidden="true"></div>
<!--APP-->
    <script type="module" src="/src/main.ts"></script>
  </body>
