<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%FULLNAME%</title>
    <meta name="description" content="%FULLNAME%: %ROLE% A retro arcade portfolio where a neural network trained by neuroevolution plays every level." />
    <meta name="theme-color" content="#100C26" />
    <meta name="color-scheme" content="dark" />
    <!-- Square icons (Google only shows square favicons, ideally multiples of 48 px). -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="%FULLNAME%" />
    <meta property="og:description" content="%ROLE% Press start to play the portfolio." />
    <meta property="og:url" content="https://matinmobini.com/" />
    <meta property="og:image" content="https://matinmobini.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tells Google the site name to show in search results. -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"%FULLNAME%","url":"https://matinmobini.com/"}</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" />

    <script>
      // Runs before first paint: mark JS as available and decide whether the intro will play,
      // so the content does not flash before the intro covers it.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          // CRT filter is off unless the visitor turned it on.
          if (localStorage.getItem('pq.crt') !== 'on') d.classList.add('no-crt');
        } catch (e) {
          d.classList.add('no-crt');
        }
        var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) d.classList.add('reduced');
        else if (!/[?&]nointro/.test(location.search)) d.classList.add('intro-pending');
      })();
    </script>
  </head>
  <body>
    <div class="boot-cover" aria-hidden="true"></div>
<!--APP-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
